<!DOCTYPE html>
<html>
<head>
    <title>Bank app</title>
</head>
<body>

<div id="container">

    <div id="bankapp">

        <h1>Bank App</h1>

        <div class="balance-box">
            <h2>Your Balance</h2>
            <h1>$5000</h1>
        </div>

        <div class="summary">
            <div class="income">
                <h3>Income</h3>
                <p>$7000</p>
            </div>

            <div class="expense">
                <h3>Expense</h3>
                <p>$2000</p>
            </div>
        </div>

        <h2>Transaction History</h2>

        <div class="transaction income-item">
            <span>Salary</span>
            <span>+$3000</span>
        </div>

        <div class="transaction expense-item">
            <span>Groceries</span>
            <span>-$150</span>
        </div>

        <div class="transaction expense-item">
            <span>Electric Bill</span>
            <span>-$80</span>
        </div>

        <h2>Add Transaction</h2>

        <input type="text" placeholder="Enter Description">

        <input type="number" placeholder="Enter Amount">

        <button>Add Transaction</button>

    </div>

</div>

</body>
</html>
