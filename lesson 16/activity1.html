<!DOCTYPE html>
<html>
    <head>
        <title>Jumbotron and Buttons</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>
    <body>
<div class="container-fluid bg-black bg-gradient p-5 text-white text-center">
    <div class="p-5">
<h1 class="display-1 mb-5"> 
    Jumbotron
</h1>
<p class="lead">
    Jumbotron is a large box where you can add texts which require special attention.
</p>
    </div>
</div>
<div class="container my-5">
    <button class="btn btn-primary btn-sm">primary</button>
    <button class="btn btn-danger btn-lg">danger</button>
    <button class="btn btn-outline-dark btn-md">dark</button>
    <button class="btn btn-secondary btn-sm">secondary</button>
    <button class="btn btn-success btn-md">success</button>
    <button class="btn btn-info btn-lg">info</button>
    <button class="btn btn-light btn-sm">light</button>
    <button class="btn btn-link btn-md">link</button>
    <button class="btn btn-warning btn-sm">warning</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
</html>
