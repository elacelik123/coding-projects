<!DOCTYPE html>
<html>
    <head>
        <title>
            Objects in JS
        </title>
    </head>
    <body>
<p id="demo"></p>
        <script>
            // create an object
var person = {
    firstName: "I",
    age: 20
} ;
// display some data from the object
document.getElementById("demo").innerHTML = person.firstName + " am " + person.age + " years old.";
        </script>
    </body>
</html>
