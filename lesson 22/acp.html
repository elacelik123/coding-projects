<!DOCTYPE html>
<html>
<head>
    <title>Methods and Loops</title>
</head>
<body>

<h2>JavaScript String Methods and Loops</h2>
<p>Numbers from 1 to 10</p>
<p id="result"></p>
<p id="random"></p>
<p id="date"></p>

<script>
let number = "";

for (let i = 1; i <= 10; i++) {
    number += i + "<br>";
}

document.getElementById("result").innerHTML = number;

document.getElementById("random").innerHTML =
    "The random number is " + Math.floor(Math.random() * 100);

let date = new Date();

document.getElementById("date").innerHTML =
    "Today's Date is " + date.getDate();
</script>

</body>
</html>
