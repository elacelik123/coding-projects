<!DOCTYPE html>
<html>
    <head><title>Output and Dropdown
    </title></head>
    <body>
        <form oninput="addition.value= parseInt(marks1.value) + parseInt(marks2.value) ">
            <label>Subject:</label>
            <select>
                <option>Maths</option>
                <option>Science</option>
            </select>
            <label>Marks:</label>
            <input type="number" id="marks1"> <br> <br>
            <label>Subjects:</label>
            <select><option>Maths</option>
            <option>Science</option></select>
            <label>Marks:</label>
            <input type="number" id="marks2">
            <br><br>
            <input type="submit">
            <br> <br>
            <output name="addition"></output>
        </form>
    </body>
</html>
