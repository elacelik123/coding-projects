<!DOCTYPE html>
<html>
    <head>
        <title>
            Float
        </title>
        <style>
            div {
                width: 200px;
                height: 200px;
                background-color:rgb(238, 124, 223);
                border:5px solid rgb(108, 19, 110);
            }
            #left {
                float:left;
            }
            #right {
                float:right;
            }
        </style>
    </head>
    <body>
        <div id="left">
            Left
        </div>
        <div id="right">
            Right
        </div>
    </body>
</html>
