<!DOCTYPE html>
<html>
<head>
    <title>Print Random Numbers</title>
</head>
<body>
    <h1>Random Numbers Using While Loop</h1>
    <script>
        let count = 1;

        while (count <= 10) {
            let randomNumber = Math.floor(Math.random() * 100);
            document.write(randomNumber + "<br>");
            count++;
        }
    </script>
</body>
</html>
