<!DOCTYPE html>
<html>
    <head>
        <title>
           Methods in Array
        </title>
    </head>
    <body>
        <p id="original_array"></p>
        <p id="joined_array"></p>
        <p id="popped_array"></p>
        <script>
var fruits = ["Mango", "Plum", "Watermelon", "Pineapple"];
document.getElementById("original_array").innerHTML = fruits;

//join() method
document.getElementById("joined_array").innerHTML = fruits.join(" - ");

//pop() method
fruits.pop();
document.getElementById("popped_array").innerHTML = fruits;
        </script>
    </body>
</html>
