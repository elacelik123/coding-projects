<!DOCTYPE html>
<html>
    <head>
        <title>
Form Validation
        </title>
    </head>
    <body>
<h3>Real-time Form Validation</h3>
<form onsubmit="validate(event)">
    <p>
        <label>Email :</label>
        <input type="email" id="email">
    </p>
    <p>
        <label>Password :</label>
        <input type="password" id="password">
    </p>
    <p>
        <input type="submit">
    </p>
</form>
<p id="validation_message"></p>
        <script src="script.js"></script>
    </body>
</html>
