<!--Convert Search and Replace a String-->
<html>
   <body>

        <h2>The JavaScript String() Method</h2>
        <p>The String() method can --Convert a number to a string</p>
        <p id="number_res"></p>
        <p id="string_res"></p>
        <script>
            var x = 70;
            var y = 90;
            document.getElementById("number_res").innerHTML = x + y;
            document.getElementById("string_res").innerHTML = String(x) + String(y);
        </script>
    </body>
</html>
