<!--Error Handling in JS-->
<html>
    <body>
        <h2>JavaScript Error Handling</h2>
        <p>The code demonstrates catch to display error</p>
        <p id="error_message"></p>
        <script>
               try{
                addalert("welcome!");
               } 
               catch(err){
                document.getElementById("error_message").innerHTML=err.message;
               } 
        </script>
    </body>

</html>
