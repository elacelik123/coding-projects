<!DOCTYPE html>
<html>
    <head>
        <title>
Methods and Loops in JS
        </title>
    </head>
    <body>
<h2>Counting up to 29!</h2>
        <script>
for (var i = 1;i <= 29;i++) {
    //code block
    document.write(i + "<br>");
}
var str1 = "Does this count up to 29?";
var pat =  new RegExp ("up");
var res = pat.test(str1);
document.write(res);
        </script>
    </body>
</html>
