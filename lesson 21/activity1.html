<!DOCTYPE html>
<html>
    <head>
        <title>
            Methods in JS 
        </title>
    </head>
    <body>
<h2>JavaScript Strings Method</h2>
<p>Basic Methods</p>
        <script>
var str= "AmAzINg";
document.write(str.toUpperCase());
document.write("<br>");
document.write(str.toLowerCase());
document.write("<br>");
document.write(str.startsWith("i"));
document.write("<br>")
document.write(str.startsWith("A"));
document.write("<br>")

// Test method -> returns true or false
var str1 = "I learnt about methods";
var pat =  new RegExp ("about");
var res = pat.test(str1);
document.write(res);
        </script>
    </body>
</html>
