<!DOCTYPE html>
<html>
<head>
    <title>Susan's Restaurant</title>

    <style>

        body{
            margin:0;
            font-family: Arial, sans-serif;
        }

        ul{
            list-style-type:none;
            margin:0;
            padding:0;
            overflow:hidden;
            background-color:#ff5a43;
        }

        li{
            float:left;
        }

        li a{
            display:block;
            color:white;
            text-align:center;
            padding:14px 20px;
            text-decoration:none;
        }

        li a:hover{
            background-color:#e04a35;
        }

        /* Banner */
        .banner{
            background-image:url("https://images.unsplash.com/photo-1517248135467-4c7edcad34c4");
            background-size:cover;
            background-position:center;
            height:350px;
            text-align:center;
            color:white;
        }

        .banner h1{
            padding-top:120px;
            font-size:50px;
        }

        .banner p{
            font-size:20px;
        }

        /* Part 2 */

        .section{
            text-align:center;
            padding:40px;
        }

        .portfolio{
            display:flex;
            justify-content:center;
            gap:20px;
            flex-wrap:wrap;
        }

        .item{
            border:1px solid #ccc;
            width:200px;
            padding:15px;
            border-radius:8px;
        }

        .item img{
            width:180px;
            height:120px;
            border-radius:5px;
        }

    </style>
</head>

<body>

    <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">Menu</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Contact</a></li>
    </ul>

    <div class="banner">
        <h1>Susan's Restaurant</h1>
        <p>Delicious Food Served Fresh Every Day</p>
    </div>

    <!-- About Section -->

    <div class="section">
        <h2>About Us</h2>

        <p>
            Welcome to Susan's Restaurant. We serve fresh, delicious food
            and provide the best dining experience for our customers!!
        </p>
    </div>

    <!-- Menu Section -->

    <div class="section">

        <h2>Our Menu</h2>

        <div class="portfolio">

            <div class="item">
                <img src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38" alt="Pizza">
                <h3>Pizza</h3>
                <p>$10</p>
            </div>

            <div class="item">
                <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd" alt="Burger">
                <h3>Burger</h3>
                <p>$8</p>
            </div>

            <div class="item">
                <img src="https://images.unsplash.com/photo-1621996346565-e3dbc646d9a9" alt="Pasta">
                <h3>Pasta</h3>
                <p>$9</p>
            </div>

        </div>

    </div>

</body>
</html>
