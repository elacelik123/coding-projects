<!DOCTYPE html>
<html>
    <head><title>CSS</title><!--Internal CSS-->
    <style>
h2 {color:orange; }
    </style>
    <link href="style.css" rel="stylesheet"></head>
    
    <body>
        <!--Inline CSS: When we use style attributes to write CSS -->
        <h1 style="color:brown">Inline CSS</h1>
        <!--Internal CSS-->
        <h2>Internal CSS</h2>
        <!--External CSS-->
        <h3>External CSS</h3>
        <!--Class and ID Selector-->
        <h4 class="myclass">Class Selector</h4>
        <h5 class="myclass" id="myid">Class Selector</h5>
        <!--Group Selector-->
        <h6>Group Selector</h6>
    <p>Group Selector</p>
    </body>
</html>
