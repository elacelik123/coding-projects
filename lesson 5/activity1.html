<!DOCTYPE html>
<html>
    <head><title>Personal Details Form</title></head>
    <body>
        <h2>Personal Details Form</h2>
        <form>
            <p>
                <label>Name:</label>
                <input type="text">
            </p>
            <p>
                <label>Email:</label>
                <input type="email">
            </p>
            <p>
                <label>Password:</label>
                <input type="password">
    
            </p>
            <p>
                <label>Gender:</label> <br>
                <input type="radio" name="gender"> Female
                <input type="radio" name="gender"> Male
            </p>
            <p>
                <label>Hobbies:</label>
                <br><input type="checkbox"> Drawing <br>
                <input type="checkbox"> Listening to Music<br>
                <input type="checkbox"> Reading
            </p>
            <p><input type="submit" value="Save Information"></p>
            

        </form>
    </body>
</html>
