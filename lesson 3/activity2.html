<!DOCTYPE html>
<html>

<head>
    <title>Lists</title>
</head>

<body>
    <h2>Unordered List</h2>
    <ul>
        <li>strawberry
        </li>
        <li>mango</li>
        <li>pineapple</li>
    </ul>
    <h2> Ordered List</h2>
    <ol>
        <li>Pencil</li>
        <li>ruler</li>
        <li>colouring pencils</li>
    </ol>
    <h2>Description List</h2>
    <dl>
        <dt>HTML</dt>
        <dd>Hyper Text Markup Language</dd>
        <dt>P.E.</dt>
        <dd>Physical Education</dd>
</body>

</html>
