<!DOCTYPE html>
<html>
<head>
    <title>Multiplication and Division Questions</title>
</head>
<body>

<button onclick="myfunction(12)">maths question!</button>
<button onclick="myfunction1(67)">maths question</button>

<script>
function myfunction(x, y) {
    if (y == undefined) {
        y = 11;
    }
    document.write(x * y);
}

function myfunction1(x, y) {
    if (y == undefined) {
        y = 89;
    }
    document.write(x / y);
}
</script>

</body>
