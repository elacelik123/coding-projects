<!DOCTYPE html>
<html>
    <head><title>Typography</title>
    <style>
        .text1 {
            color:crimson;
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 30px;
        }
        .text2 {
            color:chocolate;
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
        }
    </style></head>
    <body>
        <h1>Typography</h1>
        <p class="text1">Cats are cute</p>
        <p class="text2">Cats are amazing</p>
    </body>
</html>
