<!DOCTYPE html>
<html>
    <head>
        <title>Box Shadow, Text Shadow and Text Indent</title>
        <style>
            div {
                width:400px;
                height:150px;
                background-color: violet;
                box-shadow: 5px 10px 20px indigo;
            }
            h3 {
                text-shadow: 2px 4px 10px rgb(120, 0, 68);
                text-indent: 20px;
            }
        </style>
    </head>
    <body>
        <div>
            <h3>Box Shadow, Text Shadow, Text Indent</h3>
        </div>
    </body>
</html>
