<!DOCTYPE html>
<html>
    <head>
        <title>Transform</title>
        <style>
            div {
                width: 300px;
                height: 100px;
background-color: rgb(196, 240, 255);
border: 1px solid cornflowerblue;
            }
            #mydiv {
                transform: rotateX(180deg);
            }
        </style>
    </head>
    <body>
        <h1>Welcome to My Website</h1>
        <p>Ready to learn the rotate method...</p>
        <div>
            Website
        </div>
        <div id="mydiv">Website</div>
    </body>
</html>
