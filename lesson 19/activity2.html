<!DOCTYPE html>
<html>
    <head>
        <title>
            JavaScript Variables, Statements, and Data Types
        </title>
    </head>
    <body>
<p id="number1"></p>
<p id="name"></p>
<p id="is_student"></p>
<p id="addition"></p>
<script>
    var number1 = 200; // Statement 1
    document.getElementById("number1").innerHTML = number1; // Statement 2
    var name = "Ela";
    document.getElementById("name").innerHTML = name;
    var is_student = true;
    document.getElementById("is_student").innerHTML = is_student;
    var x = 55;
    var y = 33;
    var sum = x + y;
    document.getElementById("addition").innerHTML = sum;
</script>
    </body>
</html>
