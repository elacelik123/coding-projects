<!DOCTYPE html>
<html>
    <head>
        <title>
            Calculator
        </title>
    </head>
    <body>

<p id="addition"></p>
<p id="subtract"></p>
<p id="multiply"></p>
<p id="divide"></p>
<script>
 
    
    var x = 69;
    var y = 3;
    var sum = x + y;
    document.getElementById("addition").innerHTML = sum;
    var sub = x - y;
    document.getElementById("subtract").innerHTML = sub;
    var mul = x * y;
    document.getElementById("multiply").innerHTML = mul;
    var div = x / y;
    document.getElementById("divide").innerHTML = div;
</script>
    </body>
</html>
