<!DOCTYPE html>
<html>
    <head>
        <title>
            CSS Positions
        </title>
        <style>
            .static {
                border: 4px solid rgb(219, 135, 171);
                position: static;
            }
            .fixed {
                border: 4px solid palevioletred;
                position:fixed;
                bottom:10px;
            }
            .sticky {
                border: 5px solid paleturquoise;
                position: sticky;
                top: 0;
            }
            .relative {
                border: 4px solid goldenrod;
                position: relative;
                top: 20px;
                left: 30px;
            }
            .absolute-parent {
                border: 4px solid rgb(146, 73, 0);
                height:40px;
                margin-top:30px;
                position: relative;
            }
            .absolute {
                border: 4px solid sandybrown;
                position: absolute;
                left: 40px;
            }
        </style>
    </head>
    <body>
        <div class="static">
            Static
        </div>
        <div class="fixed">
            Fixed
        </div>
        <div class="sticky">
            Sticky
        </div>
        <div class="relative">
Relative
        </div>
        <div class="absolute-parent">
            <div class="absolute">
                Absolute
            </div>
        </div>
        <br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>
    </body>
</html>
