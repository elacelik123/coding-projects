<!DOCTYPE html>
<html>
    <head>
        <title>Cascading Effects</title>
         <link href="acp.css" rel="stylesheet"></head>
         <style>
            body {
              background-color:rgb(255, 198, 208);
              background-image: url(ai-reveals-stunning-sunset-by-the-tranquil-beach-generated-by-ai-free-photo.jpg);
background-repeat: no-repeat;
background-position:left;
height:99vh ;

            }
        </style> 
         <style>
        div {
            height:420px;
            width: 420px;
            background-color: rgb(85, 42, 165);
            color:white;
            text-align: center;
            animation-name: sunset1;
            animation-duration: 15s;
        }
        @keyframes sunset1 {
            0% {
                background-color: rgb(255, 106, 188);
            }
            25% {
                background-color: rgb(205, 63, 181);
            }
            50% {
                background-color: rgb(247, 0, 255);
            }
            75% {
                background-color: rgb(162, 0, 255);
            }
            100% {
                background-color: rgb(89, 0, 255);
            }
        }
    </style>
    </head>
    <body>
        <div>
            <h2 >Sunset</h2>
        </div>
    </head>
    <body>

    </body>
</html>
