<!DOCTYPE html>
<html>

<head>
    <title> Formatting Tags </title>
</head>

<body>
    <p>
        <b> This is bold text </b>
    </p>
    <p>
        <strong> This is strong text</strong>
    </p>
    <p>
        <i> This is itallic text</i>
    </p>
    <p>
        <em> This is emphasised text</em>
    </p>
    <p>
        This is <mark>highlighted</mark> text.
    </p>
    <p>
        This is <u>underlined</u> text.
    </p>
    <p>
        This is <small> small</small> text.
    </p>
    <p>
        Price= <del> 10 usd</del> 8 usd.
    </p>
    <!-- This is superscript-->
    <p>
        E=mc<sup>2</sup>
    </p>
    <!-- This is subscript-->
    <p>
        H<sub>2</sub>O
    </p>
    <p>Quote</p>
    <blockquote>By failing to prepare, you are preparing to fail.</blockquote>
    <q>Benjamin Franklin</q>

</body>

</html>
